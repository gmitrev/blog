title:       Georgi Mitrev
email:       gvmitrev@gmail.com
author:      Georgi Mitrev
description: "Personal blog of Georgi Mitrev"
image:       "/assets/images/og/site.png"
baseurl:     ""
url:         "https://mitrev.net"
date_format: "%b %-d, %Y"
permalink:    pretty

plugins:
  - jekyll-feed
  - jekyll-postcss
  - jekyll-sitemap
  - jekyll-target-blank

postcss:
  cache: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

exclude:
  - Gemfile
  - README.MD
  - doc
  - mise.toml
  - package.json
  - postcss.config.js
  - tailwind.config.js
  - tmp
  - yarn.lock
